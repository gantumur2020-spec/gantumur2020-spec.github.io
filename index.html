<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цахилгааны инженерчлэл хөтөлбөр — Доктор, магистр, бакалаврын сургалт</title>
<meta name="description" content="ШУТИС ЭХИС · Цахилгааны инженерчлэл хөтөлбөр · Доктор, магистр, бакалаврын сургалт">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2a5b'/%3E%3Cpath d='M12 18c8-3 14-2 20 2 6-4 12-5 20-2v28c-8-3-14-2-20 2-6-4-12-5-20-2z' fill='%23fff'/%3E%3Cpath d='M32 20v28' stroke='%230b2a5b' stroke-width='2'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#0b2a5b;--navy2:#0e3672;--navy3:#123f85;--blue:#1565d8;--blue2:#2b7de9;--sky:#e8f1fd;
  --bg:#f2f6fc;--card:#fff;--line:#e3eaf5;--ink:#0f1f3a;--muted:#62708a;--soft:#f6f9fe;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:14px;--sh:0 1px 2px rgba(15,31,58,.05),0 6px 18px rgba(15,31,58,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Noto Sans",system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
/* ---------- sidebar ---------- */
.side{background:linear-gradient(180deg,var(--navy) 0%,#0a2450 100%);color:#dfe8f7;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;z-index:20}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.brand svg{flex:none}
.brand b{display:block;color:#fff;font-size:17px;letter-spacing:.2px}
.brand small{color:#9fb4d8;font-size:12px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;color:#cfdcf2;font-weight:500;font-size:14.5px;transition:.15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a.on{background:var(--blue);color:#fff;box-shadow:0 4px 14px rgba(21,101,216,.35)}
.nav a svg{width:19px;height:19px;flex:none;opacity:.95}
.nav .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 6px}
.nav .lbl{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#7f97c0;padding:6px 12px 2px}
.me{display:flex;gap:10px;align-items:center;padding:12px 8px 2px;border-top:1px solid rgba(255,255,255,.08);margin-top:10px}
.av{width:40px;height:40px;border-radius:50%;background:#dbe7fb;display:grid;place-items:center;color:var(--navy);font-weight:700;flex:none}
.me b{display:block;color:#fff;font-size:14px;line-height:1.25}
.me small{color:#9fb4d8;font-size:12px}
/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:14px;align-items:center;padding:16px 28px;background:rgba(242,246,252,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.menu{display:none;border:0;background:#fff;border-radius:10px;width:40px;height:40px;box-shadow:var(--sh)}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px 11px 42px;font:inherit;font-size:14px;outline:none;box-shadow:0 1px 2px rgba(15,31,58,.04)}
.search input:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(43,125,233,.15)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;color:#8a97ad}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(15,31,58,.14);max-height:420px;overflow:auto;display:none;z-index:30}
.sres.show{display:block}
.sres a{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #f0f3f9;font-size:14px;align-items:flex-start}
.sres a:hover{background:var(--soft)}
.sres .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;color:#fff;flex:none;margin-top:2px}
.sres .empty{padding:14px;color:var(--muted);font-size:14px}
.topr{margin-left:auto;display:flex;gap:10px;align-items:center}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--navy)}
.content{padding:6px 28px 28px;flex:1}
h1.pg{font-size:24px;margin:8px 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
/* banner */
.hero{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(115deg,var(--navy) 0%,var(--navy3) 55%,#1d5fc4 100%);color:#fff;padding:30px 34px;min-height:178px;display:flex;align-items:center;box-shadow:0 10px 30px rgba(11,42,91,.22)}
.hero .ov{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#ffd34d;margin-bottom:8px}.hero h2{margin:0 0 6px;font-size:26px;letter-spacing:.2px}
.hero p{margin:0;color:#c9d8f3;font-size:15px}
.hero .prog{display:inline-flex;gap:8px;align-items:center;margin-top:14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-size:13px;color:#e6efff}
.hero .art{position:absolute;right:0;top:0;height:100%;opacity:.95;pointer-events:none}
.hero .txt{position:relative;z-index:1;max-width:62%}
.hero .cap{width:62px;height:62px;flex:none;margin-right:20px;position:relative;z-index:1}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:18px 0 6px}
.stat{background:var(--card);border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh)}
.stat .ic{width:48px;height:48px;border-radius:50%;background:var(--sky);display:grid;place-items:center;color:var(--blue);flex:none}
.stat .ic svg{width:24px;height:24px}
.stat small{color:var(--muted);font-size:13px;display:block}
.stat b{font-size:24px;line-height:1.1}
/* section head */
.sh{display:flex;align-items:center;gap:12px;margin:24px 0 12px;flex-wrap:wrap}
.sh h3{margin:0;font-size:18px}
.sh .more{margin-left:auto;color:var(--blue);font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px;gap:2px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--blue);color:#fff}
.tabs button .n{font-size:11px;opacity:.8;margin-left:4px}
/* course cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.cc{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.cc:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,31,58,.12)}
.cover{height:140px;position:relative;display:block}
.cover svg{width:100%;height:100%;display:block}
.lvl{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:var(--navy);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.cc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1}
.cc h4{margin:0 0 4px;font-size:15px;line-height:1.35;min-height:40px}
.cc .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.bar{height:6px;background:#e8eef8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.pl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--blue);color:#fff;border:0;border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;transition:.15s}
.btn:hover{background:#0f56bd}
.btn.ghost{background:var(--sky);color:var(--blue)}
.btn.ghost:hover{background:#d9e8fc}
.cc .btn{margin-top:14px;width:100%}
.cc.soon:hover{transform:none}.cc.soon .btn.dis{background:#cbd5e1;color:#475569;cursor:default}
.soonb{position:absolute;right:10px;top:10px;background:#fde68a;color:#78350f;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px}
.empty-lvl{background:#fff;border:1px dashed #c8d6ec;border-radius:var(--r);padding:34px;text-align:center;color:var(--muted)}
.empty-lvl b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* panels */
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.two>*{min-width:0}
.panel{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:18px 18px}
.panel h3{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eef2f8}
.row:last-child{border-bottom:0}
.dot{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12.5px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sky);color:var(--blue);white-space:nowrap}
.pill.ok{background:#dcfce7;color:#15803d}.pill.warn{background:#fef3c7;color:#b45309}
.ring{--p:0;width:150px;height:150px;border-radius:50%;background:conic-gradient(#0f9d8a calc(var(--p)*1%),#e6edf7 0);display:grid;place-items:center;margin:6px auto 4px}
.ring div{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:30px;font-weight:800;color:var(--navy)}
/* lecture list */
.lec{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;font-size:14px}
.lec:hover{background:var(--soft)}
.lec .num{width:30px;height:30px;border-radius:8px;background:var(--sky);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.lec .num.done{background:#dcfce7;color:#15803d}
.lec span.tt{flex:1}
.acc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
.acc summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.acc summary::-webkit-details-marker{display:none}
.acc summary .chev{margin-left:auto;transition:.2s;color:var(--muted)}
.acc[open] summary .chev{transform:rotate(180deg)}
.acc .inner{padding:0 10px 12px}
.links{display:flex;gap:8px;flex-wrap:wrap;padding:4px 6px 10px}
.chip{font-size:13px;padding:6px 12px;border-radius:999px;background:var(--sky);color:var(--blue);font-weight:600}
.chip:hover{background:#d6e6fb}
/* footer */
.foot{display:flex;gap:26px;align-items:center;flex-wrap:wrap;padding:18px 28px;border-top:1px solid var(--line);background:#fff;color:#35445e;font-size:13.5px}
.foot span{display:flex;gap:8px;align-items:center}
.foot svg{width:20px;height:20px;color:var(--blue)}
.foot q{margin-left:auto;font-style:normal;color:var(--navy);font-weight:600}
.foot q::before{content:"\201C"}.foot q::after{content:"\201D"}
.scrim{display:none}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;transform:translateX(-100%);transition:.25s}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(10,20,40,.4);z-index:15}
  .menu{display:grid;place-items:center}
  .top{padding:12px 14px}.content{padding:4px 14px 20px}
  .hero{padding:22px}.hero .txt{max-width:100%}.hero .art{opacity:.25}.hero .cap{display:none}
  .hero h2{font-size:21px}
  .foot q{margin-left:0}
}
@media (max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:12px}.stat .ic{width:38px;height:38px}.stat b{font-size:20px}}
</style>
</head>

    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Тайлан ба үнэлгээ</span>
    <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6"/></svg>Сургалтын материал</span>
    <q>Мэдлэг бол ирээдүйг бүтээх хүч</q>
  </footer>
</div>

function prog(c){
  const R=get(c.key,"results",{})||{},S=get(c.key,"study",{})||{};
  const tests=Object.keys(R).filter(k=>/^t\d\d$/.test(k));
  const best=tests.map(k=>Math.min(100,Math.round((R[k].best||0)*100/(c.tq||10))));
  const seen=new Set();let sec=0,last="",week=0;
  const wk=new Date();wk.setDate(wk.getDate()-7);const wks=wk.toISOString().slice(0,10);
  for(const d in S){const x=S[d]||{};sec+=x.sec||0;(x.lec||[]).forEach(n=>seen.add(+n));if(d>last)last=d;if(d>=wks)week+=x.sec||0}
  tests.forEach(k=>{const at=(R[k].at||"").slice(0,10);if(at>last)last=at});
  const n=c.lec.length;
  const pct=Math.round(100*(Math.min(seen.size,n)+Math.min(tests.length,n))/(2*n));
  const avg=best.length?Math.round(best.reduce((a,b)=>a+b,0)/best.length):null;
  const fin=get(c.key,"final",null);
  return {tests:tests.length,seen,sec,week,last,pct,avg,R,final:fin&&fin.score!=null?fin:null};
}

function ringPanel(P){

  return `<div class="ring" style="--p:${tot}"><div>${av.length?tot+"%":"—"}</div></div><p style="text-align:center;color:var(--muted);margin:0 0 10px;font-size:13px">Тестийн дундаж оноо</p>`+
   P.map(x=>`<div class="row"><div class="t"><b>${esc(x.c.code)}</b><small>${x.p.tests} тест · ${x.p.seen.size} лекц үзсэн</small></div><span class="pill ${x.p.avg==null?"":x.p.avg>=70?"ok":"warn"}">${x.p.avg==null?"—":x.p.avg+"%"}</span></div>`).join("")+
   `<p style="color:var(--muted);font-size:12px;margin:10px 0 0">Явц энэ төхөөрөмж дээрх хичээлийн вэбүүдээс уншигдана.</p>`;

  const P=A.map(c=>({c,p:prog(c)}));
  return `<h1 class="pg">Үнэлгээ</h1><p class="sub">Хичээл бүрийн тестийн дүн, үзсэн лекц, суралцсан хугацаа.</p>
  <div class="two"><div class="panel"><h3>Хичээлээр</h3>${P.map(x=>`<div class="row"><div class="dot" style="background:${x.c.acc}">${x.c.code.replace(/^I\./,"").slice(-3)}</div><div class="t"><b>${esc(x.c.name)}</b><small>${x.p.tests}/${x.c.lec.length} тест · ${x.p.seen.size} лекц · ${hmTime(x.p.sec)}${x.p.final?` · шалгалт ${x.p.final.score}`:""}</small><div class="bar" style="margin-top:6px"><i style="width:${x.p.pct}%;background:${x.c.acc}"></i></div></div><a class="pill" href="${url(x.c,"my")}">Дэлгэрэнгүй</a></div>`).join("")}</div>
  <div class="panel"><h3>Дундаж</h3>${ringPanel(P)}</div></div>`;
}
function vProgram(){
  const by=k=>C.filter(c=>c.lvl===k);
  return `<h1 class="pg">Цахилгааны инженерчлэл хөтөлбөр</h1><p class="sub">ШУТИС, Эрчим хүчний инженерийн сургууль · Доктор, магистр, бакалаврын сургалт</p>
  ${["bak","mag","doc"].map(k=>`<div class="panel" style="margin-bottom:14px"><h3>${LV[k]}ын сургалт</h3>${by(k).length?by(k).map(c=>c.soon?`<div class="row" style="opacity:.6"><div class="dot" style="background:${c.acc}">${c.code.replace(/^I\./,"").slice(-3)}</div><div class="t"><b>${esc(c.name)}</b><small>${c.code} · ${c.cr} кредит · бэлтгэгдэж байна</small></div><span class="pill">Удахгүй</span></div>`:`<a class="row" href="${url(c)}"><div class="dot" style="background:${c.acc}">${c.code.replace(/^I\./,"").slice(-3)}</div><div class="t"><b>${esc(c.name)}</b><small>${c.code} · ${c.cr} кредит · ${c.lec.length} лекц</small></div>${ic("ext",16)}</a>`).join(""):`<p style="color:var(--muted);margin:0">Цахим хичээл удахгүй нэмэгдэнэ.</p>`}</div>`).join("")}`;
}
function vAbout(){
  return `<h1 class="pg">Багшийн тухай</h1><p class="sub">Хичээлүүдийг заадаг багш</p>
  <div class="panel" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div class="av" style="width:72px;height:72px;font-size:24px;background:var(--navy);color:#fff">Ш.Г</div>
  <div style="flex:1;min-width:220px"><h3 style="margin:0 0 4px;font-size:19px">Ш.Гантөмөр</h3><div style="color:var(--muted)">ШУТИС, Эрчим хүчний инженерийн сургууль · Цахилгааны инженерчлэл хөтөлбөр</div></div></div>
  <div class="panel" style="margin-top:14px"><h3>Хичээл тус бүрийн «Багшийн тухай» хуудас</h3>${A.map(c=>`<a class="row" href="${url(c,"teacher")}"><div class="dot" style="background:${c.acc}">${c.code.replace(/^I\./,"").slice(-3)}</div><div class="t"><b>${esc(c.name)}</b><small>${c.code}</small></div>${ic("ext",16)}</a>`).join("")}</div>`;
}
const V={home:vHome,courses:vCourses,schedule:vSchedule,tasks:vTasks,tests:vTests,materials:vMaterials,labs:vLabs,grades:vGrades,program:vProgram,about:vAbout};

/* ---------- router ---------- */
function render(){
  const r=(location.hash||"#home").slice(1);const k=V[r]?r:"home";
  $("#nav").innerHTML=NAV.map(([h,t,i],n)=>(n===8?'<div class="sep"></div>':"")+`<a href="#${h}" class="${h===k?"on":""}">${ic(i)}${t}</a>`).join("");
  $("#view").innerHTML=V[k]();
  const m=me();
  $("#meBox").innerHTML=`<div class="av">${m?esc(m.name.trim().slice(0,1)):ic("user",20)}</div><div><b>${m?esc(m.name):"Зочин"}</b><small>${m?esc(m.code||"Оюутан"):"Хичээлийн вэбээр нэвтэрнэ"}</small></div>`;
  closeSide();window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("#lvTabs button");if(!b)return;
  LVL=b.dataset.l;document.querySelectorAll("#lvTabs button").forEach(x=>x.classList.toggle("on",x===b));
  const r=(location.hash||"#home").slice(1);
  if(r==="home"||r==="courses"&&false){$("#cgrid").innerHTML=grid()}else{const y=scrollY;$("#view").innerHTML=V[V[r]?r:"home"]();scrollTo(0,y)}
});
addEventListener("hashchange",render);
const side=$("#side"),scrim=$("#scrim");
function closeSide(){side.classList.remove("open");scrim.classList.remove("show")}
$("#menuBtn").onclick=()=>{side.classList.add("open");scrim.classList.add("show")};scrim.onclick=closeSide;
addEventListener("storage",()=>render());

/* ---------- search: courses + lecture topics ---------- */
const q=$("#q"),sres=$("#sres");
const norm=s=>s.toLowerCase();
q.addEventListener("input",()=>{
  const s=norm(q.value.trim());if(s.length<2){sres.classList.remove("show");return}
  const out=[];
  A.forEach(c=>{if(norm(c.name+" "+c.code).includes(s))out.push(`<a href="${url(c)}"><span class="tag" style="background:${c.acc}">${c.code.replace(/^I\./,"")}</span><span><b>${esc(c.name)}</b><br><small style="color:var(--muted)">Хичээл · ${LV[c.lvl]}</small></span></a>`);
    c.lec.forEach((t,i)=>{if(norm(t).includes(s))out.push(`<a href="${url(c,"lecture-"+(i+1))}"><span class="tag" style="background:${c.acc}">${c.code.replace(/^I\./,"")}</span><span>Лекц ${i+1}. ${esc(t)}</span></a>`)})});
  sres.innerHTML=out.slice(0,40).join("")||`<div class="empty">Илэрц олдсонгүй</div>`;sres.classList.add("show");
});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))sres.classList.remove("show")});
q.addEventListener("keydown",e=>{if(e.key==="Escape"){q.value="";sres.classList.remove("show")}});
render();
</script>
</body>
</html>
